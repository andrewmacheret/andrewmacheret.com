name: Deploy to S3

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # www/ is the whole site, so anything not in it gets deleted from the bucket
      # projects/ is skipped because each project deploys there from its own repo
      - run: aws s3 sync www s3://andrewmacheret.com --delete --exclude 'projects/*'
      # one wildcard counts as a single path for billing, and covers new files too
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3GM861BKPK1L2 \
            --paths '/*'
