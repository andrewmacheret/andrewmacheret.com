name: Deploy to S3

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/canary.yml'
  # run by hand to publish resume edits from Google Docs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # built from the home page links, so new projects show up without editing it
      - run: python3 scripts/sitemap.py > www/sitemap.xml
      # The Google Doc is the source of truth for the resume
      # --fail stops the deploy if Google sends back an error page instead of a PDF
      - name: Download resume from Google Docs
        run: |
          curl --fail --silent --show-error --location \
            --output www/resume.pdf \
            'https://docs.google.com/document/d/1Kyydz3vJ1sYyvfwZWNPxarSqZHmeRYpszG_mF5fqH5o/export?format=pdf'
          file www/resume.pdf | grep -q 'PDF document'
      # www/ is the whole site, so anything not in it gets deleted from the bucket
      # projects/ is skipped because each project deploys there from its own repo
      # Without a cache-control header, browsers can keep old files for months
      - run: aws s3 sync www s3://andrewmacheret.com --delete --exclude 'projects/*' --cache-control max-age=300
      # one wildcard counts as a single path for billing, and covers new files too
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3GM861BKPK1L2 \
            --paths '/*'
